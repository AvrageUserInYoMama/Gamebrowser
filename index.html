<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Show Bloom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent scrollbars */
            justify-content: flex-start; /* Start from top */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container for the lights to make clearing them easier */
        #lightsContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1; /* Each row takes equal vertical space */
            width: 100%;
        }

        .light {
            /* Default base styles */
            opacity: 0; /* Start invisible for custom animations */
            transition: transform 2s ease-out, opacity 0.5s ease;
        }

        .light.visible {
            opacity: 1;
        }

        /* --- THEME VISUAL STYLES --- */

        /* THEME 1: ROUND POP (Default) */
        .theme-pop .light {
            border-radius: 50%;
            filter: brightness(1.5);
            box-shadow: 0 0 15px 5px currentColor, 0 0 60px 15px currentColor, 0 0 100px 30px currentColor;
            transform: scale(0.8);
        }

        /* THEME 2: SQUARE CYBER */
        .theme-cyber .light {
            border-radius: 4px; 
            filter: brightness(1.8) contrast(1.2);
            box-shadow: 0 0 10px 2px currentColor, 0 0 40px 10px currentColor, 0 0 80px 20px currentColor;
            transform: scale(0.9) rotate(45deg); 
        }

        /* THEME 3: SUNSET HAZE */
        .theme-sunset .light {
            border-radius: 50%;
            filter: brightness(1.2) blur(5px); 
            box-shadow: 0 0 20px 10px currentColor, 0 0 80px 30px currentColor, 0 0 120px 50px currentColor;
            transform: scale(0.7);
        }

        /* NEW: SHARP (Hard squares, no rotate) */
        .theme-sharp .light {
            border-radius: 0;
            filter: brightness(1.4);
            box-shadow: 0 0 5px 2px currentColor, 0 0 20px 5px currentColor;
            transform: scale(0.85);
        }

        /* NEW: SOFT (Large bloom, small core) */
        .theme-soft .light {
            border-radius: 50%;
            filter: brightness(1.1) blur(2px);
            box-shadow: 0 0 30px 10px currentColor, 0 0 60px 20px currentColor;
            transform: scale(0.6);
        }

        /* Animation State: Intro Pulse */
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }
        
        .light.visible {
            transform: scale(1);
            animation: pulse 4s infinite ease-in-out;
        }

        /* Animation State: Fade Out */
        body.fade-out .light {
            opacity: 0 !important;
            transition: opacity 2s ease-out;
        }

        /* Animation State: Twinkle Mode */
        body.twinkle-mode .light {
            opacity: 0; 
            transform: scale(0.8);
            animation: none; 
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
        }

        body.twinkle-mode .light.active {
            opacity: 1;
            transform: scale(1.0);
        }

        /* --- CENTRAL CONTENT STYLES --- */
        .content-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 2.5s ease-in-out;
            z-index: 100; 
            width: 80%;
            max-width: 600px;
            max-height: 90vh; /* Ensure it fits on screen with many buttons */
        }

        .content-wrapper.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            flex-shrink: 0; 
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text-box {
            background: rgba(20, 20, 20, 0.85); 
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); 
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            width: 100%; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            max-height: 50vh; /* Limit height for scrollable buttons */
        }

        #appTitle {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            line-height: 1;
            flex-shrink: 0;
        }

        #appLink {
            font-size: 1.2rem;
            color: #00FFFF;
            text-decoration: none;
            letter-spacing: 2px;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* Navigation Buttons */
        .nav-buttons {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap; /* Allow buttons to wrap to new lines */
            overflow-y: auto; /* Scroll if too many buttons */
            padding-right: 5px; /* Space for scrollbar */
        }

        /* Custom scrollbar for nav */
        .nav-buttons::-webkit-scrollbar {
            width: 6px;
        }
        .nav-buttons::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 3px;
        }
        .nav-buttons::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 3px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
            min-width: 30px;
        }

        .nav-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .nav-btn.active {
            color: white;
            border-color: #00FFFF;
            background: rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 5px #00FFFF;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* --- GOLDEN BUTTON STYLE --- */
        .nav-btn.golden {
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }
        
        .nav-btn.golden:hover, .nav-btn.golden.active {
            color: white;
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
            text-shadow: 0 0 5px #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* THE EASTER EGG SQUARE */
        #easterEggSquare {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: rgba(50, 50, 50, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2000; 
            cursor: pointer;
            display: none; 
            transition: background-color 0.3s;
        }
        
        #easterEggSquare:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- The Hidden Square -->

    <!-- Central Content Wrapper -->
    <div class="content-wrapper" id="mainContent">
        
        <div class="video-box">
             <video 
                id="appVideo" 
                controls 
                muted 
                loop 
                playsinline>

            </video>

        <div class="text-box">
            <h1 id="appTitle">WEBSITE NAME</h1>

            <div class="nav-buttons" id="navButtonsContainer">

<script>
    // --- CONFIGURATION ---

    const GLOBAL_CONFIG = {

        lightsPerRow: 7,
        
        // Twinkle Settings
        maxSimultaneousLights: 10,

    };

    // --- REAL WEB GAMES LIST (53 Games) ---

    const REAL_WEB_GAMES = [

        { name: "Super Mario 64 JS", url: "https://sm64js.com/" },
        { name: "Minecraft Classic", url: "https://classic.minecraft.net/", isGolden: true },
        { name: "Cube Slam", url: "https://cubeslam.com/" },
        { name: "Quick Draw", url: "https://quickdraw.withgoogle.com/" },

        { name: "City Guesser", url: "https://virtualvacation.us/guess" },
        { name: "Drive & Listen", url: "https://driveandlisten.herokuapp.com/" },
        { name: "Windows 93", url: "http://www.windows93.net/" },
        { name: "Hacker Typer", url: "https://hackertyper.net/" },
        { name: "The Useless Web", url: "https://theuselessweb.com/" },
        { name: "QWOP", url: "https://www.foddy.net/Athletics.html" },
        { name: "Line Rider", url: "https://www.linerider.com/", isGolden: true },
        { name: "More coming soon!", url: "null" }
    ];

    const THEMES = [];

    // --- POPULATE THEMES FROM GAME LIST ---
    (function initThemes() {
        const styles = ["theme-pop", "theme-cyber", "theme-sunset", "theme-sharp", "theme-soft"];
        const anims = ["topDown", "bottomUp", "randomNoise"];
        
        // Helper to get random item
        const getRand = (arr) => arr[Math.floor(Math.random() * arr.length)];

        REAL_WEB_GAMES.forEach((game, index) => {
            
            // Format link text: "Game Name" -> "gamename.com"
            const cleanName = game.name.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            const webLinkText = `${cleanName}.com`;

            const randStyle = getRand(styles);
            const randAnim = getRand(anims);
            
            // LOGIC FOR VIDEO LINK:
            // If explicit videoSrc is provided (like for Type 2 Music), use it.
            // Otherwise, construct it using the pattern: releases/download/ferw/{Name.With.Dots}.mkv
            let videoUrl;
            if (game.videoSrc) {
                videoUrl = game.videoSrc;
            } else {
                // CHANGED: Replace spaces with dots (e.g. "Paper Minecraft" -> "Paper.Minecraft.mkv")
                const fileName = game.name.replace(/\s+/g, '.');
                // Using the specific release tag 'ferw'
                videoUrl = `https://github.com/AvrageUserInYoMama/Gamebrowser/releases/download/ferw/${fileName}.mkv`;
            }
            
            // Generate a random color palette of 6 colors
            const palette = [];
            for(let c=0; c<8; c++) {
                const hue = Math.floor(Math.random() * 360);
                const sat = 80 + Math.floor(Math.random() * 20); // 80-100%
                const light = 50 + Math.floor(Math.random() * 40); // 50-90%
                palette.push(`hsl(${hue}, ${sat}%, ${light}%)`);
            }

            THEMES.push({
                name: game.name,
                btnLabel: `${index + 1}`, // Page 1, 2, 3...
                className: randStyle,
                animationType: randAnim,
                lightSize: Math.floor(Math.random() * 40 + 70) + 'px', 
                isGolden: game.isGolden || false, // Pass golden status
                content: {
                    title: game.name.toUpperCase(),
                    linkText: webLinkText,
                    linkUrl: game.url, // Actual real URL
                    videoSrc: videoUrl // Constructed or explicit URL
                },
                colors: palette
            });
        });
    })();

    // --- STATE MANAGEMENT ---
    let currentIntervalId = null;
    let twinkleTimeouts = [];
    let activeLightsCount = 0;
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        setupNavButtons();
        setupEasterEggListener();

        // Pick a random start theme index
        const randomStart = Math.floor(Math.random() * THEMES.length);
        startLightShow(randomStart, false);
    });

    function setupNavButtons() {
        const navContainer = document.getElementById('navButtonsContainer');
        navContainer.innerHTML = ''; // Clear existing

        THEMES.forEach((theme, index) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            
            // Apply Golden Class if applicable
            if (theme.isGolden) {
                btn.classList.add('golden');
            }

            btn.textContent = theme.btnLabel;
            btn.title = theme.name; // Tooltip shows full game name
            btn.onclick = () => switchTheme(index);
            navContainer.appendChild(btn);
        });
    }

    // Handle Content Updates based on Theme
    function setupContent(theme) {
        document.getElementById('appTitle').textContent = theme.content.title;
        const link = document.getElementById('appLink');
        link.textContent = theme.content.linkText;
        link.href = theme.content.linkUrl;
        
        // Update video src directly
        const vid = document.getElementById('appVideo');
        vid.src = theme.content.videoSrc;
        vid.load(); // Reload the video element
    }

    // --- EASTER EGG LOGIC ---
    function setupEasterEggListener() {
        const egg = document.getElementById('easterEggSquare');
        egg.addEventListener('click', () => {
            alert("Congratulations! You found the hidden secret!");
            
            // Switch to Big Buck Bunny (Direct MP4)
            const vid = document.getElementById('appVideo');
            vid.src = "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"; 
            vid.load();
            vid.play();
            
            document.getElementById('appTitle').textContent = "SECRET FOUND";
            document.getElementById('appLink').textContent = "big.buck.bunny";
            
            egg.style.display = 'none'; // Hide after finding
        });
    }

    function rollForEasterEgg() {
        const egg = document.getElementById('easterEggSquare');
        egg.style.display = 'none'; // Reset to hidden
        
        // 1 in 1000 chance
        const chance = Math.random();
        
        if (chance < 0.001) { 
            // SUCCESS!
            const randomTop = Math.floor(Math.random() * 90) + 5; // 5% to 95%
            const randomLeft = Math.floor(Math.random() * 90) + 5;
            
            egg.style.top = randomTop + '%';
            egg.style.left = randomLeft + '%';
            egg.style.display = 'block';
            console.log("Easter Egg Spawned at", randomTop, randomLeft);
        }
    }

    // Exposed to global scope for buttons
    window.switchTheme = function(themeIndex) {
        // Reset everything
        stopAllAnimations();
        
        // Hide content temporarily to focus on the new light show
        const content = document.getElementById('mainContent');
        content.classList.remove('visible');
        
        // Stop video playback
        const vid = document.getElementById('appVideo');
        vid.pause();

        // Brief delay before starting new show
        setTimeout(() => {
            startLightShow(themeIndex, true);
        }, 500);
    };

    function stopAllAnimations() {
        if (currentIntervalId) clearInterval(currentIntervalId);
        twinkleTimeouts.forEach(t => clearTimeout(t));
        twinkleTimeouts = [];
        activeLightsCount = 0;
        
        document.body.className = ''; // Remove all theme/mode classes
        document.getElementById('lightsContainer').innerHTML = ''; // Clear DOM
    }

    function startLightShow(themeIndex, skipIntro = false) {
        const theme = THEMES[themeIndex];
        
        // Update Content for this page
        setupContent(theme);
        
        // Try to spawn Easter Egg
        rollForEasterEgg();

        const container = document.getElementById('lightsContainer');
        
        // Apply Theme Class to Body
        document.body.classList.add(theme.className);
        
        // Update Nav Button Active State
        const btns = document.querySelectorAll('.nav-btn');
        btns.forEach((btn, idx) => {
            if(idx === themeIndex) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        // 1. GENERATE GRID (But keep lights invisible first)
        const rows = [];
        let allLightsFlat = []; 
        let availableColors = [];

        function getColor(currentRowColors) {
            if (availableColors.length === 0) availableColors = [...theme.colors];
            
            const candidates = availableColors.filter(c => !currentRowColors.includes(c));
            let selection = candidates.length > 0 
                ? candidates[Math.floor(Math.random() * candidates.length)]
                : availableColors[Math.floor(Math.random() * availableColors.length)];
            
            const idx = availableColors.indexOf(selection);
            if (idx > -1) availableColors.splice(idx, 1);
            
            return selection;
        }

        for (let r = 0; r < GLOBAL_CONFIG.numberOfRows; r++) {
            const row = document.createElement('div');
            row.classList.add('row');
            const rowColors = [];

            for (let i = 0; i < GLOBAL_CONFIG.lightsPerRow; i++) {
                const light = document.createElement('div');
                light.classList.add('light');
                light.style.width = theme.lightSize;
                light.style.height = theme.lightSize;
                
                const color = getColor(rowColors);
                rowColors.push(color);
                light.style.color = color;
                light.style.backgroundColor = color;
                
                row.appendChild(light);
                allLightsFlat.push(light);
            }
            container.appendChild(row);
            rows.push(row);
        }

        // 2. CHECK: SKIP INTRO OR RUN ANIMATION
        if (skipIntro) {
            // IMMEDIATE MODE
            startTwinkleMode();
            
            const content = document.getElementById('mainContent');
            content.classList.add('visible');
            
            const vid = document.getElementById('appVideo');
            vid.play().catch(e => console.log("Autoplay blocked:", e));
            
            return; // Exit function, don't run animation logic below
        }

        // 3. RUN ANIMATION BASED ON THEME TYPE (Only if skipIntro is false)
        
        // Callback function to run when animation finishes
        const onAnimationComplete = () => {
            twinkleTimeouts.push(setTimeout(() => {
                document.body.classList.add('fade-out');
                
                twinkleTimeouts.push(setTimeout(() => {
                     // Clean up visible class from manual animation
                     document.querySelectorAll('.light').forEach(l => l.classList.remove('visible'));
                     document.body.classList.remove('fade-out'); 
                     
                     startTwinkleMode(); 
                     
                     // Show Content
                     const content = document.getElementById('mainContent');
                     content.classList.add('visible');
                     
                     // Play Video (Autoplay requires muted usually)
                     const vid = document.getElementById('appVideo');
                     vid.play().catch(e => console.log("Autoplay blocked:", e));

                }, 2000)); 

            }, GLOBAL_CONFIG.stayLitDuration));
        };

        // --- ANIMATION STRATEGIES ---

        if (theme.animationType === 'topDown') {
            const intervalTime = GLOBAL_CONFIG.sequenceDuration / rows.length;
            let currentRow = 0;

            currentIntervalId = setInterval(() => {
                if (currentRow < rows.length) {
                    const lightsInRow = rows[currentRow].querySelectorAll('.light');
                    lightsInRow.forEach(l => l.classList.add('visible'));
                    currentRow++;
                } else {
                    clearInterval(currentIntervalId);
                    onAnimationComplete();
                }
            }, intervalTime);

        } else if (theme.animationType === 'bottomUp') {
            const intervalTime = GLOBAL_CONFIG.sequenceDuration / rows.length;
            let currentRow = rows.length - 1; 

            currentIntervalId = setInterval(() => {
                if (currentRow >= 0) {
                    const lightsInRow = rows[currentRow].querySelectorAll('.light');
                    lightsInRow.forEach(l => l.classList.add('visible'));
                    currentRow--;
                } else {
                    clearInterval(currentIntervalId);
                    onAnimationComplete();
                }
            }, intervalTime);

        } else if (theme.animationType === 'randomNoise') {
            // Shuffle array of all lights
            for (let i = allLightsFlat.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allLightsFlat[i], allLightsFlat[j]] = [allLightsFlat[j], allLightsFlat[i]];
            }

            const intervalTime = GLOBAL_CONFIG.sequenceDuration / allLightsFlat.length;
            let currentLightIdx = 0;

            currentIntervalId = setInterval(() => {
                if (currentLightIdx < allLightsFlat.length) {
                    allLightsFlat[currentLightIdx].classList.add('visible');
                    currentLightIdx++;
                } else {
                    clearInterval(currentIntervalId);
                    onAnimationComplete();
                }
            }, intervalTime);
        }
    }

    function startTwinkleMode() {
        document.body.classList.add('twinkle-mode');
        const allLights = document.querySelectorAll('.light');
        
        allLights.forEach(light => {
            const startDelay = Math.random() * GLOBAL_CONFIG.twinkleOffMax;
            twinkleTimeouts.push(setTimeout(() => {
                scheduleBlink(light);
            }, startDelay));
        });
    }

    function scheduleBlink(light) {
        if (!document.body.classList.contains('twinkle-mode')) return;

        if (activeLightsCount >= GLOBAL_CONFIG.maxSimultaneousLights) {
            const retryDelay = Math.random() * 1000 + 500;
            twinkleTimeouts.push(setTimeout(() => scheduleBlink(light), retryDelay));
            return;
        }

        light.classList.add('active');
        activeLightsCount++;

        twinkleTimeouts.push(setTimeout(() => {
            light.classList.remove('active');
            activeLightsCount--;
            
            const offDuration = Math.random() * (GLOBAL_CONFIG.twinkleOffMax - GLOBAL_CONFIG.twinkleOffMin) + GLOBAL_CONFIG.twinkleOffMin;
            twinkleTimeouts.push(setTimeout(() => scheduleBlink(light), offDuration));

        }, GLOBAL_CONFIG.twinkleOnDuration));
    }
</script>
